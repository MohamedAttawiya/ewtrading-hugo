{{- $href := .Get "href" -}}
{{- $text := .Get "text" | default "Learn more" -}}
{{- $kind := .Get "kind" | default "secondary" -}}
{{- $trackSource := .Get "source" | default "" -}}
<a
  class="btn {{ $kind }}"
  href="{{ $href | safeURL }}"
  {{- if or (hasPrefix $href "/contact/") (hasPrefix $href "/contact?") (hasPrefix $href "mailto:") }} data-track-lead {{ end -}}
  {{- with $trackSource }} data-track-source="{{ . }}"{{ end -}}
  data-track-label="{{ $text }}"
>{{ $text }}</a>
